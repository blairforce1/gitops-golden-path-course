# Vale configuration for the course's prose.
# Run:  vale .          (from the repo root)
# The Course style enforces the hard bans from .claude/skills/course-voice:
# no em dashes, no process narration, no chatty idioms, plain words.
# Optionally add the community write-good package (passive voice, weasel
# words): set `Packages = write-good` and run `vale sync` once.

StylesPath = .vale/styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = Course

[STATUS.md]
BasedOnStyles =

; the skill quotes the banned phrases as examples
[.claude/skills/course-voice/SKILL.md]
BasedOnStyles =
